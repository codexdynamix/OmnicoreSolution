name: Deploy Omnicore Solutions to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & FTP Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build website & PHP API bundle for Hostinger
        run: npm run build:hostinger

      - name: Deploy website to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          local-dir: ./dist/
          # In Hostinger, domain-specific FTP accounts land directly inside public_html/.
          # Using './' prevents creating a redundant nested 'public_html/public_html/' folder.
          # If your FTP account lands in the parent directory, set the repository secret HOSTINGER_SERVER_DIR='public_html/'.
          server-dir: ${{ secrets.HOSTINGER_SERVER_DIR || './' }}
          security: loose
